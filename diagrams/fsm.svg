<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="770" viewBox="0 0 1290 770" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#111827">Model-based agent: finite state machine</text>
<text x="24" y="56" font-size="13" fill="#4b5563">next_state = TRANSITIONS[(current_state, event)]; each state has its own action.</text>
<rect x="30" y="80" width="1010" height="580" rx="18" fill="#fcfcfd" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="50" y="104" font-size="13" font-weight="bold" fill="#4b5563">ACTIVE (agent is still playing)</text>
