<line x1="1040.0" y1="365.0" x2="1096.0" y2="365.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="52" cy="365" r="8" fill="#111827"/>
<line x1="60" y1="365" x2="71.0" y2="365" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="75.0" y="334.0" width="150" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="150" y="361" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">START</text>
<text x="150" y="379" font-size="12" text-anchor="middle" fill="#4b5563">no move yet</text>
<rect x="255.0" y="334.0" width="150" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="330" y="361" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">OPENING</text>
<text x="330" y="379" font-size="12" text-anchor="middle" fill="#4b5563">take centre or corner</text>
<rect x="505.0" y="169.0" width="150" height="62" rx="10" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
<text x="580" y="196" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">BUILD</text>
<text x="580" y="214" font-size="12" text-anchor="middle" fill="#4b5563">extend target line</text>
<rect x="505.0" y="499.0" width="150" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="580" y="526" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">DEFEND</text>
<text x="580" y="544" font-size="12" text-anchor="middle" fill="#4b5563">block / counter-fork</text>
<rect x="815.0" y="499.0" width="150" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="890" y="526" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">ATTACK</text>
<text x="890" y="544" font-size="12" text-anchor="middle" fill="#4b5563">play a fork</text>
<rect x="815.0" y="169.0" width="150" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="890" y="196" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">FINISH</text>
<text x="890" y="214" font-size="12" text-anchor="middle" fill="#4b5563">play winning cell</text>
<rect x="1100.0" y="334.0" width="160" height="62" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
<rect x="1104.0" y="338.0" width="152" height="54" rx="7" fill="none" stroke="#111827" stroke-width="1.2"/>
<text x="1180" y="361" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">GAME_OVER</text>
<text x="1180" y="379" font-size="12" text-anchor="middle" fill="#4b5563">absorbing state</text>
<rect x="220.1" y="344.0" width="38.8" height="17" rx="3" fill="#ffffff"/>
<text x="239.5" y="355.0" font-size="11" text-anchor="middle" fill="#4b5563">QUIET</text>
<rect x="424.3" y="281.1" width="38.8" height="17" rx="3" fill="#ffffff"/>
<text x="443.7" y="292.1" font-size="11" text-anchor="middle" fill="#4b5563">QUIET</text>
<rect x="322.7" y="426.9" width="162.0" height="17" rx="3" fill="#ffffff"/>
<text x="403.7" y="437.9" font-size="11" text-anchor="middle" fill="#4b5563">MUST_BLOCK / OPP_CAN_FORK</text>
<rect x="423.0" y="353.5" width="162.0" height="17" rx="3" fill="#ffffff"/>
<text x="504.0" y="364.5" font-size="11" text-anchor="middle" fill="#4b5563">MUST_BLOCK / OPP_CAN_FORK</text>
<rect x="596.6" y="354.5" width="38.8" height="17" rx="3" fill="#ffffff"/>
<text x="616.0" y="365.5" font-size="11" text-anchor="middle" fill="#4b5563">QUIET</text>
<rect x="708.9" y="181.0" width="51.1" height="17" rx="3" fill="#ffffff"/>
<text x="734.5" y="192.0" font-size="11" text-anchor="middle" fill="#4b5563">CAN_WIN</text>
<rect x="898.4" y="354.5" width="51.1" height="17" rx="3" fill="#ffffff"/>
<text x="924.0" y="365.5" font-size="11" text-anchor="middle" fill="#4b5563">CAN_WIN</text>
<rect x="705.9" y="490.9" width="57.3" height="17" rx="3" fill="#ffffff"/>
<text x="734.5" y="501.9" font-size="11" text-anchor="middle" fill="#4b5563">CAN_FORK</text>
<rect x="700.7" y="547.1" width="69.6" height="17" rx="3" fill="#ffffff"/>
<text x="735.5" y="558.1" font-size="11" text-anchor="middle" fill="#4b5563">MUST_BLOCK</text>
<rect x="661.4" y="289.0" width="57.3" height="17" rx="3" fill="#ffffff"/>
<text x="690.0" y="300.0" font-size="11" text-anchor="middle" fill="#4b5563">CAN_FORK</text>
<rect x="664.4" y="421.0" width="51.1" height="17" rx="3" fill="#ffffff"/>
<text x="690.0" y="432.0" font-size="11" text-anchor="middle" fill="#4b5563">CAN_WIN</text>
<rect x="471.3" y="106.0" width="217.4" height="17" rx="3" fill="#ffffff"/>
<text x="580.0" y="117.0" font-size="11" text-anchor="middle" fill="#4b5563">QUIET: keep or re-plan target line</text>
<rect x="499.0" y="610.0" width="162.0" height="17" rx="3" fill="#ffffff"/>
<text x="580.0" y="621.0" font-size="11" text-anchor="middle" fill="#4b5563">MUST_BLOCK / OPP_CAN_FORK</text>
<rect x="1033.2" y="324.0" width="69.6" height="17" rx="3" fill="#ffffff"/>
<text x="1068.0" y="335.0" font-size="11" text-anchor="middle" fill="#111827">GAME_ENDED</text>
<rect x="1033.2" y="341.0" width="69.6" height="16" rx="3" fill="#ffffff"/>
<text x="1068.0" y="351.0" font-size="10" text-anchor="middle" fill="#4b5563">(any state)</text>
<text x="50.0" y="692.0" font-size="12" text-anchor="start" fill="#4b5563">Events are computed from the percept + internal model and checked in priority order:</text>
<text x="50.0" y="710.0" font-size="12" text-anchor="start" fill="#4b5563">GAME_ENDED > CAN_WIN > MUST_BLOCK > CAN_FORK > OPP_CAN_FORK > QUIET.</text>
<text x="50.0" y="728.0" font-size="12" text-anchor="start" fill="#4b5563">From every active state: CAN_WIN → FINISH, MUST_BLOCK or OPP_CAN_FORK → DEFEND, CAN_FORK → ATTACK,</text>
<text x="50.0" y="746.0" font-size="12" text-anchor="start" fill="#4b5563">QUIET → BUILD (QUIET → OPENING only from START). Arrows show the transitions that can occur in play.</text>
</svg>