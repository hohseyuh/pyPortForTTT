<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="630" viewBox="0 0 1090 630" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#111827">Model-based agent architecture</text>
<text x="24" y="56" font-size="13" fill="#4b5563">Percept → update internal model → detect event → FSM transition → state action → actuator.</text>
<rect x="30" y="80" width="760" height="520" rx="16" fill="#fcfcfd" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="50.0" y="104.0" font-size="13" text-anchor="start" fill="#4b5563">MODEL-BASED AGENT</text>
<rect x="830" y="80" width="230" height="520" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="945.0" y="104.0" font-size="13" text-anchor="middle" fill="#0369a1">ENVIRONMENT</text>
<rect x="850.0" y="190.0" width="190" height="120" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
<text x="945" y="228" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">m×m board</text>
<text x="945" y="246" font-size="12" text-anchor="middle" fill="#4b5563">opponent agent</text>
<text x="945" y="264" font-size="12" text-anchor="middle" fill="#4b5563">turn order X, O</text>
<text x="945" y="282" font-size="12" text-anchor="middle" fill="#4b5563">k-in-a-row rule</text>
<rect x="850.0" y="440.0" width="190" height="60" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
<text x="945" y="466" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Opponent move</text>
<text x="945" y="484" font-size="12" text-anchor="middle" fill="#4b5563">changes the board</text>
<rect x="595.0" y="132.0" width="170" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="680" y="156" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Sensors</text>
<text x="680" y="174" font-size="12" text-anchor="middle" fill="#4b5563">read every cell</text>
<rect x="595.0" y="492.0" width="170" height="56" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
<text x="680" y="516" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Actuators</text>
<text x="680" y="534" font-size="12" text-anchor="middle" fill="#4b5563">place mark (r, c)</text>
<rect x="285.0" y="128.0" width="270" height="64" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="420" y="156" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">What the board is like now</text>
<text x="420" y="174" font-size="12" text-anchor="middle" fill="#4b5563">updateModel(): diff with previous board</text>
<rect x="50.0" y="194.0" width="200" height="112" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="150" y="219" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Internal state</text>
<text x="150" y="237" font-size="12" text-anchor="middle" fill="#4b5563">previous board</text>
<text x="150" y="255" font-size="12" text-anchor="middle" fill="#4b5563">my / opponent moves</text>
<text x="150" y="273" font-size="12" text-anchor="middle" fill="#4b5563">target line</text>
<text x="150" y="291" font-size="12" text-anchor="middle" fill="#4b5563">FSM state</text>
<rect x="50.0" y="382.0" width="200" height="76" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="150" y="407" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Transition model</text>
<text x="150" y="425" font-size="12" text-anchor="middle" fill="#4b5563">result(board, move):</text>
<text x="150" y="443" font-size="12" text-anchor="middle" fill="#4b5563">predict forks 1 move ahead</text>
<rect x="285.0" y="268.0" width="270" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="420" y="296" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Event detector</text>
<text x="420" y="314" font-size="12" text-anchor="middle" fill="#4b5563">CAN_WIN, MUST_BLOCK, CAN_FORK, …</text>
<rect x="285.0" y="388.0" width="270" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="420" y="416" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Finite state machine</text>
<text x="420" y="434" font-size="12" text-anchor="middle" fill="#4b5563">TRANSITIONS[(state, event)]</text>
<rect x="285.0" y="502.0" width="270" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="420" y="526" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">State action</text>
<text x="420" y="544" font-size="12" text-anchor="middle" fill="#4b5563">OPENING / BUILD / DEFEND / …</text>
<line x1="850.0" y1="200.0" x2="767.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="595.0" y1="160.0" x2="557.0" y2="160.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="285.0" y1="168.0" x2="252.0" y2="210.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="250.0" y1="270.0" x2="285.0" y2="290.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="250.0" y1="420.0" x2="285.0" y2="420.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="250.0" y1="400.0" x2="285.0" y2="320.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="332.0" x2="420.0" y2="386.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="452.0" x2="420.0" y2="500.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="555.0" y1="530.0" x2="593.0" y2="528.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="767.0" y1="520.0" x2="848.0" y2="480.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M305,420 C220,520 120,520 120,306" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="62.4" y="517.0" width="285.2" height="17" rx="3" fill="#ffffff"/>
<text x="205.0" y="528.0" font-size="11" text-anchor="middle" fill="#4b5563">FSM state, target line and my move are stored</text>
<path d="M945,440 L945,312" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>